[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bivss-cd"
version = "0.1.3"
description = "Training-free open-vocabulary remote sensing change detection with bidirectional semantic object propagation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Yuan Qin"}]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
sam3 = [
  "torch>=2.7",
  "torchvision",
  "opencv-python",
  "einops>=0.8",
  "pycocotools>=2.0.7",
  "psutil>=5.9",
]
test = ["pytest>=7.4"]

[project.scripts]
bivss-cd = "bivss_cd.infer:main"
bivss-cd-eval = "bivss_cd.evaluate:main"

[tool.setuptools.packages.find]
include = ["bivss_cd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
